<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostwriter</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="#/">Ghostwriter</a></h1>
    <p id="greeting" class="handwriting"></p>
    <div class="controls">
      <label><input type="checkbox" id="plain-toggle"> Plain mode</label>
      <ul id="health" aria-label="Local services"></ul>
    </div>
    <div id="health-banner" role="alert" hidden></div>
  </header>

  <main>
    <section id="archive" class="ofrenda">
      <h2 data-voice="archive"></h2>
      <label class="meta filter">
        <span data-voice="filterLabel"></span>
        <select id="filter"><option value="" data-voice="allMemories"></option></select>
      </label>
      <div id="wall" class="wall"></div>
    </section>

    <article id="story" hidden></article>

    <section id="seance">
      <h2 data-voice="seance"></h2>
      <form id="seance-form">
        <input type="text" name="question" maxlength="500" autocomplete="off" aria-label="Your question">
        <button type="submit" data-voice="ask"></button>
      </form>
      <div id="seance-answer" aria-live="polite"></div>
      <p id="seance-sources" class="meta"></p>
    </section>

    <section id="new-story">
      <h2 data-voice="give"></h2>
      <button type="button" id="record-button" class="record" data-voice="record"></button>
      <p class="meta" data-voice="orUpload"></p>
      <form id="upload-form">
        <input type="file" name="file" accept=".wav,.mp3,.m4a,.webm,.ogg" required aria-label="Audio file">
        <button type="submit" data-voice="offer"></button>
      </form>
      <p id="upload-status" role="status"></p>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
